title: Shadow Copies Deleted Via Vssadmin Or Wmic
id: 6ab6665b-9df5-45f2-90a4-f58f3d77a575
status: experimental
description: >-
  Detects deletion or resizing of Volume Shadow Copies with vssadmin.exe or wmic.exe, a step
  ransomware takes to stop victims restoring files. Resizing the shadow storage to a tiny maximum
  silently purges existing copies, so it is treated the same as deletion.
references:
  - https://attack.mitre.org/techniques/T1490/
  - https://www.microsoft.com/en-us/security/blog/2022/06/13/the-many-lives-of-blackcat-ransomware/
author: Detection Engineering Team
date: 2026-10-09
tags:
  - attack.impact
  - attack.t1490
logsource:
  product: windows
  category: process_creation
detection:
  selection_vssadmin_img:
    - Image|endswith: '\vssadmin.exe'
    - OriginalFileName: 'VSSADMIN.EXE'
  selection_vssadmin_cli:
    - CommandLine|contains|all:
        - 'delete'
        - 'shadows'
    - CommandLine|contains|all:
        - 'resize'
        - 'shadowstorage'
  selection_wmic_img:
    - Image|endswith: '\wmic.exe'
    - OriginalFileName: 'wmic.exe'
  selection_wmic_cli:
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  condition: (selection_vssadmin_img and selection_vssadmin_cli) or (selection_wmic_img and selection_wmic_cli)
falsepositives:
  - Backup software or administrators deliberately pruning old shadow copies (rare; validate the parent process)
level: high
