title: LSASS Memory Dump Via Comsvcs MiniDump
id: 1c4f8144-55a1-4bd3-89e6-8080f948f457
status: experimental
description: Detects rundll32 calling the MiniDump export of comsvcs.dll, commonly used to dump LSASS memory for credential theft.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://lolbas-project.github.io/lolbas/Libraries/comsvcs/
author: Detection Engineering Team
date: 2026-10-08
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\rundll32.exe'
    - OriginalFileName: 'RUNDLL32.EXE'
  selection_dll:
    CommandLine|contains: 'comsvcs'
  selection_export:
    CommandLine|contains:
      - 'minidump'
      - '#24'
      - '#+24'
  condition: all of selection_*
falsepositives:
  - Unlikely
level: critical
