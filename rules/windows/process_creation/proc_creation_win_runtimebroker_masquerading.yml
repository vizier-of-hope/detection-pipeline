title: RuntimeBroker Executed From Non-System32 Location
id: f795ebd8-1de5-4767-b7c8-72cc21e50982
status: experimental
description: |
  Detects the Windows binary name RuntimeBroker.exe executing from any path other than
  System32. The legitimate COM surrogate only ever runs from C:\Windows\System32. The
  "Blinder Tunnel" campaign (CL-STA-1178) copied a renamed vshost.exe loader to
  %LOCALAPPDATA%\Microsoft\RuntimeBrokers\RuntimeBroker.exe for AppDomainManager-hijack
  execution, so a RuntimeBroker.exe anywhere else is a strong masquerading signal.
references:
  - https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/
  - https://attack.mitre.org/techniques/T1036/005/
author: Detection Engineering Team
date: 2026-10-09
tags:
  - attack.stealth
  - attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\RuntimeBroker.exe'
  filter_main_system32:
    Image: 'C:\Windows\System32\RuntimeBroker.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
  - Portable or developer builds of unrelated tools that happen to ship a RuntimeBroker.exe
level: high
