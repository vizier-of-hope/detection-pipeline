title: AWS Root Account Activity
id: 16fa06b9-5d7e-41e6-aa55-6c920e1c4744
status: experimental
description: |
  Detects API calls or console sign-ins made with the AWS account root user. AWS guidance is to
  lock the root user away and use it only for a few account-level tasks, so routine use is either
  a policy breach or a compromised root credential. Events that AWS services generate on behalf
  of the root user (eventType AwsServiceEvent) are excluded.
references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-tasks.html
  - https://attack.mitre.org/techniques/T1078/004/
author: Lim Yong An
date: 2026-10-09
tags:
  - attack.initial-access
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    userIdentity.type: Root
  filter_aws_service:
    eventType: AwsServiceEvent
  condition: selection and not filter_aws_service
falsepositives:
  - The few tasks that need root (closing the account, changing the support plan, restoring IAM admin access); allow-list them by eventName once confirmed
level: medium
